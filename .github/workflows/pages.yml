name: Publish static site to gh-pages

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: gh-pages-sync
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Force-publish allowlisted files to gh-pages
        run: |
          set -euo pipefail

          test -f index.html
          for f in \
            assets/hero-bg.avif assets/hero-bg.webp assets/hero-bg.jpg \
            assets/hero-bg-1280.avif assets/hero-bg-1280.webp assets/hero-bg-1280.jpg \
            assets/hero-bg-768.avif assets/hero-bg-768.webp assets/hero-bg-768.jpg
          do
            test -f "$f"
          done

          PUBLISH_DIR="$(mktemp -d)"
          cp index.html "$PUBLISH_DIR/index.html"
          mkdir -p "$PUBLISH_DIR/assets"
          cp assets/hero-bg.avif assets/hero-bg.webp assets/hero-bg.jpg \
             assets/hero-bg-1280.avif assets/hero-bg-1280.webp assets/hero-bg-1280.jpg \
             assets/hero-bg-768.avif assets/hero-bg-768.webp assets/hero-bg-768.jpg \
             "$PUBLISH_DIR/assets/"
          touch "$PUBLISH_DIR/.nojekyll"

          git checkout --orphan gh-pages-tmp
          git rm -rf .
          git clean -fdx

          cp -R "$PUBLISH_DIR/." .

          git add index.html .nojekyll \
            assets/hero-bg.avif assets/hero-bg.webp assets/hero-bg.jpg \
            assets/hero-bg-1280.avif assets/hero-bg-1280.webp assets/hero-bg-1280.jpg \
            assets/hero-bg-768.avif assets/hero-bg-768.webp assets/hero-bg-768.jpg
          while IFS= read -r file; do
            case "$file" in
              index.html|.nojekyll|assets/hero-bg.avif|assets/hero-bg.webp|assets/hero-bg.jpg|assets/hero-bg-1280.avif|assets/hero-bg-1280.webp|assets/hero-bg-1280.jpg|assets/hero-bg-768.avif|assets/hero-bg-768.webp|assets/hero-bg-768.jpg) ;;
              *)
                echo "Unexpected file staged for gh-pages publish: $file"
                exit 1
                ;;
            esac
          done < <(git ls-files)
          git commit -m "Publish static site from ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
