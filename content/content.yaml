surnames:
  label: "Ономастика"
  title: "Фамилии рода"
  lead: "Десять самых частых фамилий в базе; женские формы посчитаны вместе с мужскими."
  count_suffix: "в базе"
  default_note: "Фамилия встречается в семейном древе; происхождение уточняется."
  notes:
    Матюхин: >
      Русская фамилия от уменьшительной формы имени Матвей (Матюха). В селе Мокрое Белевского
      уезда достоверно прослеживается с Андрея Федотовича (р. 1870). Имя Матвей является в роду
      историческим (в ревизии 1834 г. зафиксирован дед Матвей, давший отчество Илье Матвееву,
      и один из сыновей Григория — Матвей); версия о происхождении фамилии от имени Матюха
      в этой ветви наиболее вероятна. Принадлежность отца Андрея — Федота Григорьева (ок. 1817–1818)
      к Матюхиным как документальный факт в 1834 г. не записана.
    Скиба: >
      Украинская фамилия (скиба — «ломоть хлеба»); род из села Лозовая Павловка на
      Донбассе, затем Тула и Химки.
    Захаров: >
      Род из Толкиша (Татария): Ермил → Спиридон → Григорий Спиридонович, который
      писался и Захаровым, и Алексеевым.
    Алексеев: >
      Внимание: в древе две несвязанные ветви Алексеевых — татарская (из Захаровых)
      и донбасская. Обе сходятся в бабушках Надежды Скиба.
    Поташкин: >
      От прозвища «поташник»; корни в деревне Серганиха Валдайского уезда Новгородской губернии.
    Астафьев: "От имени Астафий; линия матери Сергея Матюхина — Дмитров и Долгопрудный."
    Никитин: "Родня по браку; связи в подмосковных записях базы."
    Сахаров: "Родня по браку; связи требуют уточнения по документам."
    Цыганов: "Родня по браку в ветви Поташкиных."
    Игнатьев: "Родня по браку; встречается в ветви Алексеевых."
    Чернов: "Астраханская родня по браку: Черновы жили в Астрахани с конца XIX века."
    Горелов: "Линия прабабушки Марии Гореловой по ветви Матюхиных."
    Алексанов: "Прапрабабушка по линии Матюхиных — Прасковья Алексанова."
    Елисеев: "Зинаида Елисеева из Толкиша — прапрабабушка Надежды по линии Алексеевых."
    Васильев: "Встречается в ветви Алексеевых через брак."
    Букин: "Родня по браку в ветви Алексеевых."
    Успенский: "Родня по браку; ветвь уточняется."
    Яковлев: "Родня по браку в ветви Скиба."

