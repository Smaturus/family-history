  matyukhiny:
    title: "Матюхины"
    root: "root"
    page_id: "page-matyukhiny"
    tree_page_id: "page2"
    entry: "Матюхины и Астафьевы. Мокрое, Дмитров и Долгопрудный."
    lead: "Линии Сергея по отцу и по матери: Матюхины и Астафьевы."
    tree_title: "Древо Матюхиных"
    tree_lead: >
      Предки Сергея по отцу и матери. Супруга и общая дочь показаны в начальной семье;
      предки супруги относятся к разделу «Скиба». Дальние поколения прокручиваются по горизонтали.
    branches_label: "Прямые предки"
    branches_title: "Родовые ветви"
    branches:
      matyukhin_father:
        tag: "Линия Сергея · по отцу"
        title: "Матюхины"
        basis: "Семейные сведения и ревизская сказка 1834 года"
        geography: "Мокрое · Белевский уезд · Тульская губерния"
        paragraphs:
          - >
            Корни в селе <b>Мокрое</b> Белевского уезда Тульской губернии. В семейных
            материалах родителями Андрея Федотовича названы <b>Федот Григорьев</b> и
            <b>Параскева Петрова</b>.
          - >
            В ревизской сказке 1834 года найдена семья <b>Ильи Матвеева</b>, его сына
            <b>Григория</b> и внука <b>Федота</b>. Фамилия Матюхин в этой записи у них не указана.
      astafyev_mother:
        tag: "Линия Сергея · по матери"
        title: "Астафьевы"
        basis: "Семейные сведения"
        geography: "Дмитров · Долгопрудный"
        paragraphs:
          - >
            <b>Надежда Астафьева</b> (1931–1997) — мать Сергея. Её родители —
            <b>Алексей Астафьев</b> и <b>Мария Архиповна</b>; девичья фамилия Марии
            в базе не указана.
    sources:
      label: "Документы"
      title: "Документы и семейные сведения"
      items:
        - kind: "Архивный документ"
          title: "Ревизская сказка по селу Мокрое"
          date: "1834"
          reference: "Двор №26, лист 689, кадр 0168"
          paragraphs:
            - >
              В мужской половине двора записаны <b>Илья Матвеев</b> (ок. 1767–1834+),
              его сын <b>Григорий Ильин</b> (ок. 1789–1834+) и внук
              <b>Федот Григорьев</b> (ок. 1817–1818). Другие сыновья Григория —
              <b>Пётр</b> (ок. 1814–1815), <b>Матвей</b> (ок. 1826–1827) и
              <b>Иван</b> (ок. 1827–1828).
            - >
              В женской половине записаны жена Ильи <b>Аграфена</b> (ок. 1770–1771),
              жена Григория <b>Степанида</b> (43 года в 1834 году) и дочери Григория
              <b>Анна</b> (14 лет) и <b>Агафья</b> (1 год).
            - >
              Илье, Григорию и Федоту фамилия Матюхин в записи не приписана.
              Связь этой семьи с позднейшими Матюхиными требует подтверждения
              связующими документами.
        - kind: "Семейные сведения"
          title: "Родители Андрея Федотовича Матюхина"
          paragraphs:
            - >
              В семейных материалах родителями Андрея названы <b>Федот Григорьев</b>
              и <b>Параскева Петрова</b>.
        - kind: "Семейные сведения"
          title: "Линия Астафьевых"
          paragraphs:
            - >
              В записи прямой линии указаны <b>Надежда Астафьева</b> (1931–1997),
              её отец <b>Алексей Астафьев</b> и мать <b>Мария Архиповна</b>.
      archives_title: "Архивные направления"
      archives:
        - "Ревизские сказки 1850 года Белевского уезда (ГАТО, Тула)."
        - "Метрики по селу Мокрое Белевского уезда (ГАТО, Тула)."
    places:
      label: "География"
      title: "Места ветвей"
      items:
        - name: "село Мокрое Тульской области"
          note: "Место записей Матюхиных; ревизская сказка 1834 года."
        - name: "город Дмитров, Московская область"
          note: "Родина Надежды Астафьевой (1931)."
        - name: "город Долгопрудный, Московская область"
          note: "Последний адрес Надежды Астафьевой."
        - name: "город Химки, Московская область"
          note: "Здесь поженились Сергей и Надежда."
    chronicle:
      label: "Хроника"
      title: "Значимые события"
      events:
        - date: "1834"
          title: "Ревизская сказка по селу Мокрое"
          place: "Двор №26: семьи Ильи Матвеева и Григория Ильина."
        - date: "1870"
          title: "Родился Андрей Федотович Матюхин"
          place: "Село Мокрое."
        - date: "1892"
          title: "Родились Иван Андреевич Матюхин и Прасковья Власовна Алексанова"
        - date: "1931"
          title: "Родились Андрей Иванович Матюхин и Надежда Алексеевна Астафьева"
