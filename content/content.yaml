sections:
  matyukhiny:
    title: "Матюхины"
    root: "root"
    page_id: "page-matyukhiny"
    tree_page_id: "page2"
    entry: "Матюхины и Астафьевы. Мокрое, Дмитров и Долгопрудный."
    lead: "Линии Сергея по отцу и по матери: Матюхины и Астафьевы."
    tree_title: "Древо Матюхиных"
    tree_lead: >
      Предки Сергея по отцу и матери. Супруга и общая дочь показаны в начальной семье;
      предки супруги относятся к разделу «Скиба». Дальние поколения прокручиваются по горизонтали.
    branches_label: "Прямые предки"
    branches_title: "Родовые ветви"
    branches:
      matyukhin_father:
        tag: "Линия Сергея · по отцу"
        title: "Матюхины"
        basis: "Основные фамилии: Матюхины, Алексановы, Гореловы"
        paragraphs:
          - >
            Связь семьи из ревизской сказки 1834 года с позднейшими Матюхиными
            требует подтверждения связующими документами.
      astafyev_mother:
        tag: "Линия Сергея · по матери"
        title: "Астафьевы"
        basis: "Основная фамилия: Астафьевы"
        paragraphs: []
    sources:
      label: "Документы"
      title: "Документы и источники"
      items:
        - id: "mokroe-revision-1834"
          kind: "Архивный документ"
          title: "Ревизская сказка по селу Мокрое"
          date: "1834"
          reference: "Двор №26, лист 689, кадр 0168"
          paragraphs:
            - >
              В мужской половине двора записаны <b>Илья Матвеев</b> (ок. 1767–1834+),
              его сын <b>Григорий Ильин</b> (ок. 1789–1834+) и внук
              <b>Федот Григорьев</b> (ок. 1817–1818). Другие сыновья Григория —
              <b>Пётр</b> (ок. 1814–1815), <b>Матвей</b> (ок. 1826–1827) и
              <b>Иван</b> (ок. 1827–1828).
            - >
              В женской половине записаны жена Ильи <b>Аграфена</b> (ок. 1770–1771),
              жена Григория <b>Степанида</b> (43 года в 1834 году) и дочери Григория
              <b>Анна</b> (14 лет) и <b>Агафья</b> (1 год).
            - >
              Илье, Григорию и Федоту фамилия Матюхин в записи не приписана.
          people: [p42, p39, p29, p45, p46, p47, p48, p49, p43, p40]
        - id: "matyukhiny-family-materials"
          kind: "Семейные сведения"
          title: "Семейные материалы Матюхиных и Астафьевых"
          people: [p16, p50, p05, p10, p11]
    places:
      label: "Географический указатель"
      title: "Населённые пункты"
      items:
        - id: "matyukhiny-mokroe"
          name: "село Мокрое, Белевский уезд, Тульская губерния (Тульская область)"
          match: "село Мокрое Тульской области"
          documents: [mokroe-revision-1834]
        - id: "matyukhiny-dmitrov"
          name: "город Дмитров, Московская область"
          people:
            - {id: p05, relation: birth}
        - id: "matyukhiny-dolgoprudny"
          name: "город Долгопрудный, Московская область"
          people:
            - {id: p05, relation: last_residence}
        - id: "matyukhiny-khimki"
          name: "город Химки, Московская область"
          people:
            - {id: p01, relation: marriage}
            - {id: p03, relation: marriage}
    chronicle:
      label: "Хроника"
      title: "Значимые события"
      events:
        - date: "1834"
          title: "Ревизская сказка по селу Мокрое"
          place: "Двор №26: семьи Ильи Матвеева и Григория Ильина."
        - date: "1870"
          title: "Родился Андрей Федотович Матюхин"
          place: "Село Мокрое."
        - date: "1892"
          title: "Родились Иван Андреевич Матюхин и Прасковья Власовна Алексанова"
        - date: "1931"
          title: "Родились Андрей Иванович Матюхин и Надежда Алексеевна Астафьева"
        - date: "1971"
          title: "Родился Сергей Андреевич Матюхин"
        - date: "2002"
          title: "Родилась Анна Сергеевна Матюхина — общая дочь Сергея и Надежды"
    gallery:
      title: "Фотографии"
      photos: []

  skiba:
    title: "Скиба"
    root: "spouse"
    page_id: "page-skiba"
    tree_page_id: "page3"
    entry: "Скибы, Поташкины и Захаровы. Донбасс, Валдай и Татария."
    lead: "Линии Надежды по отцу и по матери: Скибы, Поташкины и Захаровы."
    tree_title: "Древо Скиба"
    tree_lead: >
      Предки Надежды по отцу и матери. Супруг и общая дочь показаны в начальной семье;
      предки супруга относятся к разделу «Матюхины». Дальние поколения прокручиваются по горизонтали.
    branches_label: "Прямые предки"
    branches_title: "Родовые ветви"
    branches:
      skiba_father:
        tag: "Линия Надежды · по отцу"
        title: "Скибы"
        basis: "Основные фамилии: Скибы, Захарченковы"
        paragraphs: []
      potashkin_mother:
        tag: "Линия Надежды · по матери"
        title: "Поташкины и Захаровы"
        basis: "Основные фамилии: Поташкины, Захаровы, Алексеевы, Елисеевы"
        paragraphs: []
    collateral:
      label: "Совпадение фамилий"
      title: "Две ветви Алексеевых"
      lead: >
        Две семьи Алексеевых не являются родственными. Донбасская ветвь связана
        с бабушкой Надежды по отцу, татарская — с бабушкой по матери.
      items:
        - tag: "Татария · из Захаровых"
          title: "Захаровы-Алексеевы"
          basis: "Основные фамилии: Захаровы, Алексеевы, Елисеевы"
          paragraphs:
            - >
              <b>Ермил Захаров</b> → <b>Спиридон Ермилович</b> →
              <b>Григорий Спиридонович</b> (1887–1966), записанный как
              «Захаров/Алексеев».
            - >
              Старший сын Григория и <b>Зинаиды Елисеевой</b>, <b>Василий</b>,
              остался Захаровым; младшие дети — <b>Александр</b>, <b>Серафима</b>,
              <b>Иван</b> и <b>Константин</b> — стали Алексеевыми.
        - tag: "Донбасс · самостоятельный род"
          title: "Алексеевы донбасские"
          basis: "Основная фамилия: Алексеевы"
          paragraphs:
            - >
              <b>Василий Васильевич Алексеев</b> (1875–1935) и
              <b>Агафья Андреевна</b> — родители восьми детей. Их дочь
              <b>Маргарита</b> (1909–1987) вышла за <b>Алексея Скиба</b>.
            - >
              Родство с татарскими Алексеевыми в документах не прослеживается:
              это разные семьи с совпадающей фамилией.
    sources:
