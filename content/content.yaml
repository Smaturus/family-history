  skiba:
    title: "Скиба"
    root: "spouse"
    page_id: "page-skiba"
    tree_page_id: "page3"
    entry: "Скибы, Поташкины и Захаровы. Донбасс, Валдай и Татария."
    lead: "Линии Надежды по отцу и по матери: Скибы, Поташкины и Захаровы."
    tree_title: "Древо Скиба"
    tree_lead: >
      Предки Надежды по отцу и матери. Супруг и общая дочь показаны в начальной семье;
      предки супруга относятся к разделу «Матюхины». Дальние поколения прокручиваются по горизонтали.
    branches_label: "Прямые предки"
    branches_title: "Родовые ветви"
    branches:
      skiba_father:
        tag: "Линия Надежды · по отцу"
        title: "Скибы"
        basis: "Семейные сведения"
        geography: "Лозовая Павловка · Донецкая область · Химки"
        paragraphs:
          - >
            Род из села <b>Лозовая Павловка</b>. В прямой линии указаны
            <b>Алексей Скиба</b> (1907–1955), его отец <b>Григорий</b> (р. 1879)
            и дед <b>Андрей Скиба</b>. Жена Алексея — <b>Маргарита Алексеева</b>
            (1909–1987) из донбасской ветви Алексеевых.
      potashkin_mother:
        tag: "Линия Надежды · по матери"
        title: "Поташкины и Захаровы"
        basis: "Семейные сведения"
        geography: "Валдай · Серганиха · Толкиш · Чистополь"
        paragraphs:
          - >
            <b>Нина Поташкина</b> (1938–2000) — мать Надежды. Её отец
            <b>Федор Поташкин</b> связан с Валдаем, мать <b>Серафима Алексеева</b> —
            с Чистополем; род Серафимы восходит к <b>Захаровым</b> и
            <b>Елисеевым</b> из Толкиша.
    collateral:
      label: "Совпадение фамилий"
      title: "Две ветви Алексеевых"
      lead: >
        Две семьи Алексеевых не являются родственными. Донбасская ветвь связана
        с бабушкой Надежды по отцу, татарская — с бабушкой по матери.
      items:
        - tag: "Татария · из Захаровых"
          title: "Захаровы-Алексеевы"
          basis: "Семейные сведения"
          geography: "Толкиш · Новошешминск · Чистополь"
          paragraphs:
            - >
              <b>Ермил Захаров</b> → <b>Спиридон Ермилович</b> →
              <b>Григорий Спиридонович</b> (1887–1966), записанный как
              «Захаров/Алексеев».
            - >
              Старший сын Григория и <b>Зинаиды Елисеевой</b>, <b>Василий</b>,
              остался Захаровым; младшие дети — <b>Александр</b>, <b>Серафима</b>,
              <b>Иван</b> и <b>Константин</b> — стали Алексеевыми.
        - tag: "Донбасс · самостоятельный род"
          title: "Алексеевы донбасские"
          basis: "Семейные сведения"
          geography: "Донецкая область · Лозовая Павловка · Химки"
          paragraphs:
            - >
              <b>Василий Васильевич Алексеев</b> (1875–1935) и
              <b>Агафья Андреевна</b> — родители восьми детей. Их дочь
              <b>Маргарита</b> (1909–1987) вышла за <b>Алексея Скиба</b>.
            - >
              Родство с татарскими Алексеевыми в документах не прослеживается:
              это разные семьи с совпадающей фамилией.
    sources:
      label: "Документы"
      title: "Документы и семейные сведения"
      items:
        - kind: "Семейные сведения"
          title: "Скибы Лозовой Павловки"
          paragraphs:
            - >
              В записи прямой линии указаны <b>Андрей Скиба</b>,
              <b>Григорий Скиба</b> (р. 1879), <b>Алексей Скиба</b> (1907–1955)
              и <b>Эдуард Скиба</b> (1937–2015).
        - kind: "Семейные сведения"
          title: "Поташкины и Захаровы-Алексеевы"
          paragraphs:
            - >
              <b>Федор Поташкин</b> (1904–1970) и <b>Серафима Алексеева</b>
              (1912–1988) — родители <b>Нины Поташкиной</b> (1938–2000).
              Род Серафимы связан с Толкишем и Чистополем.
        - kind: "Семейные сведения"
          title: "Две семьи Алексеевых"
          paragraphs:
            - >
              Донбасская ветвь — семья <b>Маргариты Алексеевой</b> (1909–1987),
              татарская — семья <b>Серафимы Алексеевой</b> (1912–1988).
              Родство между ними в документах не прослеживается.
      archives_title: "Архивные направления"
      archives:
        - "Метрики Славяносербского уезда — Скибы (Лозовая Павловка)."
        - "Метрики Валдайского уезда — Поташкины (ГАНО)."
        - "Метрики Чистопольского уезда — Захаровы-Алексеевы (ГА РТ)."
        - "Записи ЗАГС по Химкам и Московской области."
    places:
      label: "География"
      title: "Места ветвей"
      items:
        - name: "село Лозовая Павловка, Донбасс"
          note: "Здесь родились Григорий Скиба (1879) и Алексей Скиба (1907)."
        - name: "Донецкая область"
